<link rel="stylesheet" href="assets/mistwood.css">
<style>
/* ===== 详情页专属 ===== */

/* 进度线：2px 苔绿，linear（规范唯一允许匀速的地方） */
#progress{
  position:fixed; top:0; left:0; right:0; height:2px; z-index:20;
  background:var(--moss); transform:scaleX(0); transform-origin:0 50%;
}

.post-head{ padding:24vh 0 56px; max-width:680px; margin:0 auto; }
.post-meta{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em;
  color:var(--ink-3); margin-bottom:20px;
}
.post-title{
  font-family:"Noto Serif SC","Songti SC","STSong",serif;
  font-size:clamp(32px,6vw,42px); font-weight:600; line-height:1.4; letter-spacing:.02em;
}
.post-sub{ margin-top:18px; color:var(--ink-2); font-size:15px; }

/* 目录：宽屏吸附右侧，移动端隐藏 */
#toc{
  position:fixed; right:max(4vw, 24px); top:34vh; z-index:5;
  display:flex; flex-direction:column; gap:12px; max-width:180px;
  opacity:0; animation:toc-in .8s cubic-bezier(.22,1,.36,1) 1s forwards;
}
@keyframes toc-in{ to{ opacity:1; } }
#toc a{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.08em;
  color:var(--ink-3); transition:color .3s cubic-bezier(.22,1,.36,1); padding-left:14px; position:relative;
}
#toc a::before{
  content:""; position:absolute; left:0; top:50%; width:6px; height:1px;
  background:var(--ink-3);
  transition:background .3s cubic-bezier(.22,1,.36,1),width .3s cubic-bezier(.22,1,.36,1);
}
#toc a:hover{ color:var(--ink); }
#toc a.on{ color:var(--moss-ink); }
#toc a.on::before{ background:var(--moss); width:10px; }
@media (max-width:1240px){ #toc{ display:none; } }

/* 正文：衬线长文，680 栏 */
.post-body{
  max-width:680px; margin:0 auto;
  font-family:"Noto Serif SC","Songti SC","STSong",serif;
  font-size:18px; line-height:1.9; letter-spacing:.01em;
}
.post-body p{ margin-bottom:28px; }
.post-body h2{
  font-size:30px; font-weight:600; margin:64px 0 24px; letter-spacing:.02em;
}
.post-body h2::before{ content:""; display:block; width:32px; height:1px; background:var(--moss); margin-bottom:16px; }
.post-body em{ letter-spacing:-.015em; color:var(--moss-ink); }
.post-body code{
  font-family:"IBM Plex Mono",monospace; font-size:.85em;
  background:var(--glass); border:1px solid var(--glass-border);
  padding:2px 7px; border-radius:6px;
}

/* 正文链接：下划线加深 + 变粗 1px，不做滑入（§8.3）；颜色走正文级档 --moss-ink */
.post-body a{
  color:var(--moss-ink); text-underline-offset:3px;
  text-decoration-line:underline; text-decoration-thickness:1px;
  text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);
  transition:text-decoration-color .3s cubic-bezier(.22,1,.36,1),text-decoration-thickness .3s cubic-bezier(.22,1,.36,1);
}
.post-body a:hover{ text-decoration-color:currentColor; text-decoration-thickness:2px; }

/* 正文图片：不裁框，按原比例走满栏宽；雾散开 + 褪色由共享底座负责（§8.4 / §10.5） */
.post-body img{ position:static; width:auto; max-width:100%; height:auto; border-radius:8px; }
.post-body figure.shot{ margin:44px 0; }
.post-body figure.shot .frame{
  display:block; position:relative; border-radius:16px; overflow:hidden;
  border:1px solid var(--glass-border);
  background:linear-gradient(150deg,var(--bg-top),var(--glass));
}
.post-body figure.shot img{ display:block; width:100%; height:auto; border-radius:0; }
.post-body figcaption{
  margin-top:14px; font-family:"IBM Plex Mono",monospace;
  font-size:12px; letter-spacing:.12em; color:var(--ink-3);
}

/* 上下篇：大号文字链接，同页脚语言 */
.post-nav{
  max-width:680px; margin:14vh auto 0; display:flex; justify-content:space-between; gap:32px;
  border-top:1px solid var(--line); padding-top:48px;
}
.post-nav a{
  font-family:"Noto Serif SC","Songti SC","STSong",serif; font-size:22px; font-weight:600;
  transition:color .3s cubic-bezier(.22,1,.36,1);
}
.post-nav a:hover{ color:var(--moss-ink); }
.post-nav a:active{ transform:scale(.98); transition:transform .4s cubic-bezier(.24,1.32,.4,1); }
.post-nav span{
  display:block; margin-bottom:10px;
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em; color:var(--ink-3);
}
.post-nav .next{ text-align:right; }

@media (max-width:720px){
  .post-head{ padding:18vh 0 40px; }
  .post-nav{ flex-direction:column; }
  .post-nav .next{ text-align:left; }
}

/* 目录靠 animation 显形，减弱偏好下 animation 被关掉 ⇒ 直接给终态 */
@media (prefers-reduced-motion:reduce){ #toc{ opacity:1; } }
</style>
</head>

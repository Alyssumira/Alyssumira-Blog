<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="mistwood">
  <!-- 四棵杉树合成一条 path：重叠处不叠色（同一个 fill、nonzero 同向），
       否则半透明相交会长出第五棵树。雾只吃底部三成——apex 全程是实的，
       16px 下认出"树"靠的就是尖顶。亮色版，暗色见 favicon-dark.svg -->
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5F7D63" stop-opacity="1"/>
      <stop offset=".62" stop-color="#5F7D63" stop-opacity="1"/>
      <stop offset="1" stop-color="#5F7D63" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <path fill="url(#fog)" d="M4.5 15 9 32 0 32Z M12 6 17.5 32 6.5 32Z M20.5 12.5 25.5 32 15.5 32Z M27.5 9 32.5 32 22.5 32Z"/>
</svg>
